name: Build and deploy Python project to Azure Functions - rakk-ai

on:
  push:
    branches:
      - azure-deployment
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.' # set this to the path to your web app project, defaults to the repository root
  PYTHON_VERSION: '3.12'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Skip installing dependencies - Azure Functions will handle this
      # - name: Install dependencies
      #   run: |
      #     python -m pip install --upgrade pip
      #     pip install -r requirements.txt

      # Optional: Add step to run tests here

      - name: Create clean deployment package
        run: |
          # Create a clean directory for deployment
          mkdir deployment
          
          # Copy only necessary files
          cp function_app.py deployment/
          cp main.py deployment/
          cp host.json deployment/
          cp requirements.txt deployment/
          cp -r app deployment/
          
          # Copy Azure Functions configuration
          if [ -f "function.json" ]; then cp function.json deployment/; fi
          if [ -f "local.settings.json" ]; then cp local.settings.json deployment/; fi
          if [ -f ".funcignore" ]; then cp .funcignore deployment/; fi
          
          # Create the deployment package
          cd deployment
          zip -r ../deployment-package.zip . -x "__pycache__/*" "*.pyc" ".git*"
          cd ..
          
          # Verify package contents
          echo "Package contents:"
          unzip -l deployment-package.zip

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: deployment-package.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B3C30D71F63E4F798EA6EB0714A9ECB4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6D60C00BDA07495E8B22DB05236B6CFD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5A51FA4C6AE343B19E2460B16E6F56F8 }}

      - name: 'Deploy to Azure Functions'
        uses: Azure/functions-action@v1
        id: deploy-to-function
        with:
          app-name: 'rakk-ai'
          slot-name: 'Production'
          package: deployment-package.zip
