name: Build and deploy Python project to Azure App Service - rakk-ai

on:
  push:
    branches:
      - azure-deployment
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Clean up unnecessary files
        run: |
          rm -rf test-env/
          rm -rf .git/
          find . -name "__pycache__" -type d -exec rm -rf {} + || true
          find . -name "*.pyc" -delete || true

      - name: Zip artifact for deployment
        run: |
          zip -r release.zip . -x "__pycache__/*" ".git/*" "test-env/*" "venv/*" ".pytest_cache/*" "*.pyc"

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B3C30D71F63E4F798EA6EB0714A9ECB4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6D60C00BDA07495E8B22DB05236B6CFD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5A51FA4C6AE343B19E2460B16E6F56F8 }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'rakk-ai'
          package: release.zip

      - name: Configure startup command
        run: |
          az webapp config set \
            --name rakk-ai \
            --resource-group rakkrag-rg \
            --startup-file "gunicorn -k uvicorn.workers.UvicornWorker api.main:app --bind=0.0.0.0:8000"
        continue-on-error: true
